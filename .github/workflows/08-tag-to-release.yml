name: Crear release desde un tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # No publicar al eliminar o mover un tag existente.
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Descargar historial y tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar notas y publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Permitir reejecutar el workflow sin duplicar un release publicado.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "El release de $TAG ya existe."
            exit 0
          fi

          # Buscar el tag anterior en los ancestros de esta versión.
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          range="HEAD"
          notes_args=()
          if [[ -n "$previous_tag" ]]; then
            range="refs/tags/${previous_tag}..HEAD"
            notes_args+=(--notes-start-tag "$previous_tag")
            base="refs/tags/${previous_tag}"
          else
            # Comparar contra un árbol vacío para la primera versión.
            base="$(git hash-object -t tree /dev/null)"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Historial de commits\n\n'
            if [[ -n "$previous_tag" ]]; then
              printf 'Cambios desde `%s` hasta `%s`.\n\n' "$previous_tag" "$TAG"
            else
              printf 'Primera versión: historial completo hasta `%s`.\n\n' "$TAG"
            fi
            git log "$range" --pretty=format:'- %h %s (%an)' --no-decorate
            printf '\n\n## Archivos modificados\n\n```text\n'
            git diff --stat "$base" HEAD --
            printf '```\n\n'
            printf '[Logs de ejecución del workflow](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$notes_file"

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${notes_args[@]}" \
            --notes-file "$notes_file"
