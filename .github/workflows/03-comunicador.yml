name: comuniucador de la legion del mal

on:
  workflow_dispatch:
    inputs:
        villano: 
            description: "Que villano envia el mensaje"
            required: true
            type: choice
            options: 
                - Lex Luthor
                - Joker
                - Brainiac
        mensaje: 
            description: "Mensaje para el consejo"
            required: true
            default: "La mision fue un exito"

        prioridad: 
            description: "Nivel de prioridad"
            required: true
            type: choice
            options: 
                - Normal
                - Alta
                - Critica
        

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
   
    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo "--------------------"
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
      - uses: actions/checkout@v4