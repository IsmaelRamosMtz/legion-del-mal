name: Reclutamiento de Agente

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps: 
      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el lider de la legion del mal"

      - name: Reporte de identidad 
        run: |
          echo "Report de identidad"
          echo "================================="
          echo ""
          echo "Nombre clave : ${{ github.actor }}"
          echo "Contexto de github"
          echo "Repositorio : ${{ github.repository }}"
          echo "Operacion : ${{ github.sha }}"
          echo "Metadata: ${{toJson(github)}}"

      - name: Capacidades del agente
        run: |
            echo "Capacidad detectadas:"
            echo "Sistema operativo"
            uname -a
            echo "Habilidad tecnicas"
            node --version
            git --version

      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          ls / 